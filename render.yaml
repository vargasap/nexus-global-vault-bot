services:
  - type: web
    name: nexus-global-cloud-bots
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python cloud_runner.py
    plan: free
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN_VAULT
        sync: false
      - key: BOT_TOKEN_ARCADE
        sync: false
      - key: BOT_TOKEN_PULSE
        sync: false
      - key: OWNER_ID
        value: 5593082133
